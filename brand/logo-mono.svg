<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="currentColor">
  <!-- 单色版:继承 currentColor,可用于深/浅底、印刷、favicon 掩码 -->
  <rect x="1.25" y="1.25" width="45.5" height="45.5" rx="9" fill="none" stroke="currentColor" stroke-width="2.5"/>

  <!-- 表头 -->
  <rect x="8" y="9.5" width="32" height="4" rx="2"/>

  <!-- 合并单元格:纵跨两行 -->
  <rect x="8" y="18" width="9.5" height="12.5" rx="2"/>

  <!-- 普通单元格 -->
  <rect x="19.25" y="18" width="9.5" height="4" rx="2" opacity="0.82"/>
  <rect x="30.5"  y="18" width="9.5" height="4" rx="2" opacity="0.82"/>
  <rect x="19.25" y="26.5" width="9.5" height="4" rx="2" opacity="0.82"/>
  <rect x="30.5"  y="26.5" width="9.5" height="4" rx="2" opacity="0.82"/>

  <!-- 末行被视窗裁切 -->
  <rect x="8"     y="35" width="9.5" height="4" rx="2" opacity="0.38"/>
  <rect x="19.25" y="35" width="9.5" height="4" rx="2" opacity="0.38"/>
  <rect x="30.5"  y="35" width="9.5" height="4" rx="2" opacity="0.38"/>
</svg>
